# desk_hub 宏键盘 (ESP32-S3-N16R8) —— RMK keyboard.toml
# 配置文档: https://rmk.rs/docs/configuration/
# 灯光配置在旁边的 rgb.toml 里，跟本文件分开。
#
# 云端编译：push 到 wwttzc/Desk_Hub 后，.github/workflows/build.yml 用 rmkit
#           生成工程（模板来自 rmk-rs/rmk-template），固件依赖 wwttzc/rmk_rgb
#           的 lighting 分支，产物是 esp32 用的 .bin

[keyboard]
name = "desk_hub"                  # 工程名（也是产物 .bin 的名字），不出现在 USB/BLE
product_name = "Desk Hub"          # USB 产品字符串 + BLE 设备名
vendor_id = 0x4c4b                 # USB VID
product_id = 0x4643                # USB PID
manufacturer = "wwttzc"
chip = "esp32s3"                   # 与 board 二选一，不能同时写
usb_enable = true

[matrix]
# 6 行 x 4 列 = 24 个电气位置，实际只焊 19 个键
row_pins = ["GPIO5", "GPIO6", "GPIO7", "GPIO15", "GPIO16", "GPIO17"]
col_pins = ["GPIO9", "GPIO10", "GPIO11", "GPIO12"]
# 二极管方向 col2row（列=输出/阳极，行=输入/阴极），是默认值，故不写 row2col

[layout]
# rows/cols 必须等于 row_pins/col_pins 的数量（电气矩阵），不是键数
rows = 6
cols = 4
# map 的顺序 = keymap 里按键的顺序；只列真实存在的 19 个位置
# 空缺位置：(0,2) (0,3) (2,3) (4,3) (5,1)
# 两个 2u 键的开关在下面那格：KpPlus=(3,3)、KpEnter=(5,3)
map = """
(0,0)  (0,1)
(1,0)  (1,1)  (1,2)  (1,3)
(2,0)  (2,1)  (2,2)  (3,3,@2u_tall)
(3,0)  (3,1)  (3,2)
(4,0)  (4,1)  (4,2)  (5,3,@2u_tall)
(5,0,@2u)      (5,2)
"""

[keymap]
layers = 2

[[keymap.layer]]
name = "base"
keys = """
No        No
NumLock   KpSlash  KpAsterisk  KpMinus
Kp7       Kp8      Kp9         KpPlus
Kp4       Kp5      Kp6
Kp1       Kp2      Kp3         KpEnter
Kp0                KpDot
"""

# 第 1 层留空（全是透明），等你在 Vial 里填。
[[keymap.layer]]
name = "fn"
keys = """
_  _
_  _  _  _
_  _  _  _
_  _  _
_  _  _  _
_     _
"""

[ble]
# 关闭 BLE：不再广播/配对。注意 esp32s3 只有 esp32s3_ble 这个 feature 能拿到
# esp-hal，所以 BLE 栈仍会被编进固件，只是运行时不启用。
enabled = false
